<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>AdCheck | 광고 과장 의심도 분석</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#17243a;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:6vh auto;padding:20px}.card{background:white;border:1px solid #e0e6ee;border-radius:22px;padding:28px;box-shadow:0 10px 35px #182e4611}.logo{font-size:15px;font-weight:800;color:#2764dd;letter-spacing:.08em}h1{font-size:clamp(24px,5vw,34px);margin:12px 0}p{line-height:1.65;color:#526075}.field{display:flex;gap:10px;margin-top:24px}input{min-width:0;flex:1;font-size:16px;padding:15px;border:1px solid #c6d1dc;border-radius:12px}button{font-size:15px;border:0;border-radius:12px;background:#245de0;color:white;font-weight:700;padding:14px 22px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.hint{font-size:13px;color:#6a7789;margin-top:12px}.result{margin-top:24px;border-top:1px solid #e7ebf0;padding-top:22px}.muted{color:#6e7b8d}.big{font-weight:800;font-size:64px;letter-spacing:-.04em}.tag{display:inline-block;padding:7px 12px;border-radius:10px;background:#f0f3f8;font-weight:800}.bar{height:10px;border-radius:10px;background:#e7edf5;overflow:hidden;margin:16px 0}.fill{height:100%;background:#e4a42d;transition:width .3s}ul{padding-left:21px;line-height:1.8}small{color:#6b7786;line-height:1.55;display:block}a{word-break:break-all} .error{background:#fff5ec;color:#8a451a;border-radius:12px;padding:16px;line-height:1.65}@media(max-width:550px){.wrap{margin:2vh auto;padding:12px}.card{padding:20px}.field{display:block}.field button{width:100%;margin-top:10px}}
</style></head><body><main class="wrap"><section class="card"><div class="logo">AD CHECK · 무료 / API 키 불필요</div><h1>과장·허위광고 의심도 분석</h1><p>광고 링크만 붙여넣으세요. 공개 웹페이지의 문구를 읽고 과장 표현을 점검합니다.</p><form id="form"><label for="url"><strong>광고 주소</strong></label><div class="field"><input id="url" type="url" placeholder="https://m.site.naver.com/..." required autocomplete="url"/><button id="submit" type="submit">광고 분석하기</button></div></form><div class="hint">상품 설명 입력 필요 없음 · 광고 사이트가 접근을 차단하거나 이미지/영상에만 내용이 있으면 판정 불가가 나올 수 있습니다.</div><div id="out" aria-live="polite"></div></section><p style="text-align:center;font-size:13px">이 도구는 AI나 공식 사실 확인 기관이 아닌 규칙 기반 1차 점검 도구입니다.</p></main><script>
const form=document.getElementById('form'),out=document.getElementById('out'),btn=document.getElementById('submit');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='분석 중…';out.innerHTML='<div class="result muted">광고 링크에 접속하고 있습니다…</div>';try{const r=await fetch('/api/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:document.getElementById('url').value})});const d=await r.json();if(d.status!=='ok'){out.innerHTML=`<div class="result"><h2>판정 불가</h2><div class="error">${esc(d.reason)}</div>${d.finalUrl?`<p><small>최종 이동 주소: ${esc(d.finalUrl)}</small></p>`:''}<p class="hint">이 경우 임의의 점수를 표시하지 않습니다.</p></div>`;return;}const color=d.score>=70?'#db5246':d.score>=55?'#d8a02c':'#29a179';out.innerHTML=`<section class="result"><h2>${esc(d.title||'광고 분석 결과')}</h2><p class="muted">과장·허위광고 문구 의심도</p><div class="big">${d.score}%</div><span class="tag">${esc(d.grade)}</span><div class="bar"><div class="fill" style="width:${d.score}%;background:${color}"></div></div><h3>발견한 표현</h3>${d.found.length?`<ul>${d.found.map(x=>`<li><strong>${esc(x.label)}</strong> — “${esc(x.excerpt)}”</li>`).join('')}</ul>`:'<p>미리 등록한 주요 과장 표현은 발견되지 않았습니다. 실제로 거짓이 없다는 뜻은 아닙니다.</p>'}<h3>확인한 내용 일부</h3><p>${esc(d.preview)}</p><small>${esc(d.warning)}</small><p><small>확인 주소: ${esc(d.finalUrl)}</small></p></section>`;}catch{out.innerHTML='<div class="result error">서버에 연결할 수 없어요. Node.js 서버를 실행했는지 확인해 주세요.</div>';}finally{btn.disabled=false;btn.textContent='광고 분석하기';}});
</script></body></html>
